name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex_review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check OpenAI API key
        if: ${{ secrets.OPENAI_API_KEY == '' }}
        run: |
          echo "OPENAI_API_KEY is not configured. Add it in repository secrets."
          exit 1

      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pre-fetch base and head refs
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: read-only

      - name: Upload Codex output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-pr-review-output
          path: codex-output.md
          if-no-files-found: ignore

      - name: Upsert Codex review comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- codex-pr-review -->';
            const maxMessageLength = 60000;
            if (!fs.existsSync('codex-output.md')) {
              core.info('codex-output.md does not exist, skip commenting');
              return;
            }
            const rawMessage = fs.readFileSync('codex-output.md', 'utf8').trim();
            if (!rawMessage) {
              core.info('codex-output.md is empty, skip commenting');
              return;
            }
            const finalMessage = rawMessage.length > maxMessageLength
              ? `${rawMessage.slice(0, maxMessageLength)}\n\n[truncated]`
              : rawMessage;
            const body = `${marker}\n## Codex Review\n\n${finalMessage}`;
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
